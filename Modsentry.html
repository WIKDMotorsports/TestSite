<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { initializeFirestore, doc, setDoc, getDocs, collection, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD27xD4cCvzYFbdKLOdtF3sxLAPnPpQLo8",
            authDomain: "activity-log-7d4d6.firebaseapp.com",
            projectId: "activity-log-7d4d6",
            storageBucket: "activity-log-7d4d6.appspot.com",
            messagingSenderId: "751457913972",
            appId: "1:751457913972:web:ce8972d2aa78c215039521",
            measurementId: "G-VJEJDWM1NW"
        };

        const COLLECTION_NAME = "vehicle_mods";

        const statusBadge = document.getElementById('statusBadge');
        const statusMessage = document.getElementById('statusMessage');
        const addBtn = document.getElementById('addBtn');
        const modGrid = document.getElementById('modGrid');
        const emptyState = document.getElementById('emptyState');
        const modForm = document.getElementById('modForm');

        let db;
        let statusTimeout;

        // ---------------- FIREBASE OBS CONTROLS ----------------
        const obsBadge = document.getElementById('obsBadge');
        const loadingRecBtn = document.getElementById('loadingRecBtn');
        const dynoRecBtn = document.getElementById('dynoRecBtn');
        let activeRecordingState = 'idle';

        function setObsBadge(msg, color) {
            obsBadge.textContent = 'OBS: ' + msg;
            obsBadge.style.color = color || 'var(--color-text-muted)';
            obsBadge.style.borderColor = color || 'var(--color-border)';
        }

        function setButtonRecordingState(state) {
            if (state === 'recording_loading') {
                loadingRecBtn.classList.add('is-recording');
                loadingRecBtn.lastChild.textContent = ' Stop Loading Recording';
                dynoRecBtn.disabled = true;
            } else if (state === 'recording_dyno') {
                dynoRecBtn.classList.add('is-recording');
                dynoRecBtn.lastChild.textContent = ' Stop Dyno Pull Recording';
                loadingRecBtn.disabled = true;
            } else {
                loadingRecBtn.classList.remove('is-recording');
                loadingRecBtn.lastChild.textContent = ' Start Loading Recording';
                loadingRecBtn.disabled = false;
                
                dynoRecBtn.classList.remove('is-recording');
                dynoRecBtn.lastChild.textContent = ' Start Dyno Pull Recording';
                dynoRecBtn.disabled = false;
            }
        }

        async function sendObsCommand(actionStr) {
            try {
                // Write the command to Firebase. The Python script is listening to this document.
                await setDoc(doc(db, "obs_control", "command"), {
                    action: actionStr,
                    req_id: Date.now()
                });
            } catch (err) {
                console.error("Error sending command:", err);
                flashMessage('Failed to send command to OBS', true);
            }
        }

        loadingRecBtn.addEventListener('click', () => {
            if (activeRecordingState === 'recording_loading') {
                sendObsCommand('stop');
            } else {
                sendObsCommand('start_loading');
            }
        });

        dynoRecBtn.addEventListener('click', () => {
            if (activeRecordingState === 'recording_dyno') {
                sendObsCommand('stop');
            } else {
                sendObsCommand('start_dyno');
            }
        });
        // ---------------- END FIREBASE OBS CONTROLS ----------------

        function setBadge(msg, color) {
            statusBadge.textContent = msg;
            statusBadge.style.color = color || 'var(--color-text-muted)';
            statusBadge.style.borderColor = color || 'var(--color-border)';
        }

        function flashMessage(msg, isError) {
            clearTimeout(statusTimeout);
            statusMessage.textContent = msg;
            statusMessage.style.color = isError ? 'var(--color-danger)' : 'var(--color-success)';
            statusTimeout = setTimeout(() => { statusMessage.textContent = ''; }, 3000);
        }

        // Rest of your Mod Tracker rendering logic remains untouched below
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        function escapeAttr(str) {
            return escapeHtml(str).replace(/"/g, '&quot;');
        }

        function buildTitle(data) {
            const parts = [
                data.year || data.vehicleYear, 
                data.make || data.vehicleMake, 
                data.model || data.vehicleModel,
                data.trim || data.vehicleTrim 
            ].filter(Boolean);
            return parts.length > 0 ? parts.join(' ') : (data.ymm || 'Untitled Build');
        }

        function renderMods(entries) {
            modGrid.innerHTML = '';
            if (entries.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            entries.forEach(({ id, data }) => {
                const card = document.createElement('div');
                card.className = 'mod-card';
                modGrid.appendChild(card);
                renderViewCard(card, id, data);
            });
        }

        function renderViewCard(card, id, data) {
            let hpLine = '';
            if (data.startHp || data.endHp) {
                const start = data.startHp || '?';
                const end = data.endHp || '?';
                hpLine = `<div class="hp-line">${escapeHtml(start)} HP &rarr; ${escapeHtml(end)} HP</div>`;
            }

            let customerHtml = '';
            if (data.customerName || data.customerInstagram) {
                const name = data.customerName ? escapeHtml(data.customerName) : '';
                const ig = data.customerInstagram ? escapeHtml(data.customerInstagram) : '';
                customerHtml = `<div class="text-xs mb-2" style="color: var(--color-primary); font-weight: 600;">
                    👤 ${name} ${ig ? `(${ig})` : ''}
                </div>`;
            }

            let extraHtml = '';
            if (data.futureGoals) {
                extraHtml += `<div class="mt-2"><strong class="text-xs uppercase" style="color: var(--color-text-muted);">Future Goals:</strong><p class="mods-text">${escapeHtml(data.futureGoals)}</p></div>`;
            }
            if (data.postTuneComments) {
                extraHtml += `<div class="mt-2"><strong class="text-xs uppercase" style="color: var(--color-text-muted);">Post-Tune Comments:</strong><p class="mods-text">${escapeHtml(data.postTuneComments)}</p></div>`;
            }

            const activeMods = data.mods || data.priorMods || 'No mods listed.';

            card.innerHTML = `
                <h3>${escapeHtml(buildTitle(data))}</h3>
                ${customerHtml}
                ${hpLine}
                <div class="mt-2"><strong class="text-xs uppercase" style="color: var(--color-text-muted);">Mods:</strong><p class="mods-text">${escapeHtml(activeMods)}</p></div>
                ${extraHtml}
                <div class="card-footer">
                    <button class="card-btn edit-btn">Edit</button>
                    <button class="card-btn delete-btn">Delete</button>
                </div>
            `;
            card.querySelector('.edit-btn').addEventListener('click', () => renderEditCard(card, id, data));
            card.querySelector('.delete-btn').addEventListener('click', () => deleteEntry(id));
        }

        function renderEditCard(card, id, data) {
            card.innerHTML = `
                <div class="edit-fields space-y-2">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2">
                        <input type="number" class="form-element px-2 py-2 edit-year" placeholder="Year" value="${escapeAttr(data.year || data.vehicleYear || '')}">
                        <input type="text" class="form-element px-2 py-2 edit-make" placeholder="Make" value="${escapeAttr(data.make || data.vehicleMake || '')}">
                        <input type="text" class="form-element px-2 py-2 edit-model" placeholder="Model" value="${escapeAttr(data.model || data.vehicleModel || '')}">
                        <input type="text" class="form-element px-2 py-2 edit-trim" placeholder="Trim" value="${escapeAttr(data.trim || data.vehicleTrim || '')}">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="number" class="form-element px-2 py-2 edit-startHp" placeholder="Start HP" value="${escapeAttr(data.startHp || '')}">
                        <input type="number" class="form-element px-2 py-2 edit-endHp" placeholder="End HP" value="${escapeAttr(data.endHp || '')}">
                    </div>
                    <textarea class="form-element w-full px-2 py-2 edit-mods" rows="2" placeholder="Modifications">${escapeHtml(data.mods || data.priorMods || '')}</textarea>
                    
                    <div class="text-xs uppercase mt-2" style="color: var(--color-text-muted); font-weight: 600;">Customer & Extra Info</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="text" class="form-element px-2 py-2 edit-custName" placeholder="Customer Name" value="${escapeAttr(data.customerName || '')}">
                        <input type="text" class="form-element px-2 py-2 edit-custIg" placeholder="Instagram" value="${escapeAttr(data.customerInstagram || '')}">
                    </div>
                    <textarea class="form-element w-full px-2 py-2 edit-future" rows="2" placeholder="Future Goals">${escapeHtml(data.futureGoals || '')}</textarea>
                    <textarea class="form-element w-full px-2 py-2 edit-postTune" rows="2" placeholder="Post-Tune Comments">${escapeHtml(data.postTuneComments || '')}</textarea>
                </div>
                <div class="card-footer">
                    <button class="card-btn cancel-btn">Cancel</button>
                    <button class="card-btn save-btn">Save</button>
                </div>
            `;
            card.querySelector('.cancel-btn').addEventListener('click', () => renderViewCard(card, id, data));
            card.querySelector('.save-btn').addEventListener('click', () => handleSaveEdit(card, id, data));
        }

        async function handleSaveEdit(card, id, originalData) {
            const updated = {
                year: card.querySelector('.edit-year').value.trim(),
                make: card.querySelector('.edit-make').value.trim(),
                model: card.querySelector('.edit-model').value.trim(),
                trim: card.querySelector('.edit-trim').value.trim(), 
                startHp: card.querySelector('.edit-startHp').value,
                endHp: card.querySelector('.edit-endHp').value,
                mods: card.querySelector('.edit-mods').value,
                customerName: card.querySelector('.edit-custName').value.trim(),
                customerInstagram: card.querySelector('.edit-custIg').value.trim(),
                futureGoals: card.querySelector('.edit-future').value.trim(),
                postTuneComments: document.querySelector('.edit-postTune').value.trim(),
                createdAt: originalData.createdAt || Date.now()
            };

            if (!updated.make || !updated.model) {
                flashMessage('Make and Model are required.', true);
                return;
            }

            try {
                await setDoc(doc(db, COLLECTION_NAME, id), updated);
                renderViewCard(card, id, updated);
                flashMessage('Updated!', false);
            } catch (err) {
                console.error(err);
                flashMessage('Update failed: ' + err.message, true);
            }
        }

        async function loadMods() {
            try {
                const snapshot = await getDocs(collection(db, COLLECTION_NAME));
                const entries = [];
                snapshot.forEach(d => entries.push({ id: d.id, data: d.data() }));
                entries.sort((a, b) => (b.data.createdAt || 0) - (a.data.createdAt || 0));
                renderMods(entries);
                setBadge('Synced', '#22c55e');
            } catch (err) {
                console.error(err);
                setBadge('Load failed', '#ef4444');
                flashMessage('Could not load mods: ' + err.message, true);
            }
        }

        async function deleteEntry(id) {
            try {
                await deleteDoc(doc(db, COLLECTION_NAME, id));
                await loadMods();
                flashMessage('Deleted.', false);
            } catch (err) {
                console.error(err);
                flashMessage('Delete failed: ' + err.message, true);
            }
        }

        modForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const year = document.getElementById('year').value.trim();
            const make = document.getElementById('make').value.trim();
            const model = document.getElementById('model').value.trim();
            const trim = document.getElementById('trim').value.trim(); 

            if (!make || !model) return;

            const newEntry = {
                year,
                make,
                model,
                trim, 
                startHp: document.getElementById('startHp').value,
                endHp: document.getElementById('endHp').value,
                mods: document.getElementById('modsList').value,
                customerName: document.getElementById('custName').value.trim(),
                customerInstagram: document.getElementById('custIg').value.trim(),
                futureGoals: document.getElementById('futureGoals').value.trim(),
                postTuneComments: document.getElementById('postTuneComments').value.trim(),
                createdAt: Date.now()
            };

            addBtn.disabled = true;
            try {
                const docRef = doc(collection(db, COLLECTION_NAME), Date.now().toString());
                await setDoc(docRef, newEntry);
                modForm.reset();
                
                const detailsPanel = modForm.querySelector('details');
                if (detailsPanel) detailsPanel.open = false;

                await loadMods();
                flashMessage('Added!', false);
            } catch (err) {
                console.error(err);
                flashMessage('Save failed: ' + err.message, true);
            } finally {
                addBtn.disabled = false;
            }
        });

        (function init() {
            try {
                setBadge('Connecting...');
                const app = initializeApp(firebaseConfig);
                db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
                addBtn.disabled = false;
                loadMods();

                // Start listening to the Python script's status in Firebase
                const statusRef = doc(db, "obs_control", "status");
                onSnapshot(statusRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        activeRecordingState = data.state || 'idle';
                        
                        setButtonRecordingState(activeRecordingState);

                        if (activeRecordingState === 'recording_loading') {
                            setObsBadge('Recording Loading...', '#ef4444');
                        } else if (activeRecordingState === 'recording_dyno') {
                            setObsBadge('Recording Dyno...', '#ef4444');
                        } else if (activeRecordingState === 'error') {
                            setObsBadge('Error', '#ef4444');
                            flashMessage('OBS Error: ' + (data.message || 'Unknown'), true);
                        } else {
                            setObsBadge('Ready', '#22c55e');
                        }
                    }
                });

            } catch (err) {
                console.error(err);
                setBadge('Init failed', '#ef4444');
                flashMessage('Firebase init failed: ' + err.message, true);
            }
        })();
    </script>
